name: Release smoke test

# Runs after every platform build, and on any push that touches this file.
# It checks production, so give Vercel a minute before reading a failure as a bug.
on:
  push:
    branches: [main, 'arena/**']
    paths:
      - '.github/workflows/smoke.yml'
  workflow_run:
    workflows: ['Desktop (Windows)', 'Android', 'iOS']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  smoke:
    name: Verify the live product
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    concurrency:
      group: release-smoke
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Website pages
        run: |
          set -euo pipefail
          base=https://voxbridge-mic.vercel.app
          for path in / /download /features /setup /privacy /terms /security /licenses /support \
                      /phone-as-microphone; do
            code=$(curl -fsSL -o /dev/null -w '%{http_code}' "$base$path")
            echo "$path -> $code"
            test "$code" = "200"
          done
          curl -fsSL "$base/download" -o /tmp/download.html
          # Downloads are served from the site itself now, not from GitHub.
          for file in VoxBridge-android.apk VoxBridge-ios.ipa \
            VoxBridge-windows-setup.exe VoxBridge-windows-portable.zip; do
            grep -q "/downloads/$file" /tmp/download.html
          done
          grep -q 'data-download="android"' /tmp/download.html
          grep -q 'data-download="ios"' /tmp/download.html
          echo "download links present"
          # The search-intent guide has to stay crawlable and machine-readable.
          curl -fsSL "$base/phone-as-microphone" -o /tmp/guide.html
          grep -q 'rel="canonical"' /tmp/guide.html
          grep -q 'property="og:image"' /tmp/guide.html
          grep -q '"@type": "HowTo"' /tmp/guide.html
          echo "guide page has canonical, social card and HowTo markup"

      - name: Same-origin downloads
        run: |
          set -euo pipefail
          base=https://voxbridge-mic.vercel.app
          curl -fsSL "$base/downloads/manifest.json" -o /tmp/manifest.json
          cat /tmp/manifest.json
          python3 - <<'PY'
          import json
          manifest = json.load(open('/tmp/manifest.json'))
          files = manifest.get('files') or {}
          for key in ('android', 'ios', 'windows', 'portable'):
              entry = files.get(key)
              assert entry, f'{key} missing from the download manifest'
              assert entry['size'] > 1000, f'{key} size looks wrong: {entry["size"]}'
              assert len(entry['sha256']) == 64, f'{key} checksum is not sha256'
          print('manifest covers', ', '.join(sorted(files)))
          PY

          # Every artifact must arrive as an attachment, with a real length and
          # range support — a phone cannot show progress or resume without them.
          for pair in "VoxBridge-android.apk:application/vnd.android.package-archive" \
                      "VoxBridge-ios.ipa:application/zip" \
                      "VoxBridge-windows-setup.exe:application/x-msdownload" \
                      "VoxBridge-windows-portable.zip:application/zip"; do
            file=${pair%%:*}
            want=${pair#*:}
            headers=$(curl -fsSIL "$base/downloads/$file")
            echo "$file"
            echo "$headers" | grep -qi '^HTTP/.* 200'
            echo "$headers" | grep -qi "^content-type: $want"
            echo "$headers" | grep -qi '^content-disposition: attachment'
            echo "$headers" | grep -qi '^accept-ranges: bytes'
            length=$(echo "$headers" | tr -d '\r' | awk 'tolower($1)=="content-length:"{print $2}' | tail -1)
            test -n "$length" && test "$length" -gt 1000
            echo "  $length bytes, $want"
          done

          # Range requests are what let a dropped mobile connection resume.
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Range: bytes=0-99' \
            "$base/downloads/VoxBridge-android.apk")
          echo "range request -> $code"
          test "$code" = "206"

      - name: Release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag=$(gh release view --json tagName --jq .tagName)
          echo "latest release: $tag"
          test "$tag" = "v$(python3 -c 'import json;print(json.load(open("/tmp/manifest.json"))["version"])')"
          mkdir -p dl
          cd dl
          # Platform builds upload in parallel, so the release can be briefly
          # incomplete while this runs.
          for attempt in 1 2 3 4 5 6; do
            gh release download "$tag" --clobber --pattern 'VoxBridge-*' --dir . || true
            count=$(ls VoxBridge-* 2>/dev/null | wc -l)
            echo "attempt $attempt: $count assets present"
            test "$count" -ge 4 && break
            sleep 20
          done
          test "$(ls VoxBridge-* 2>/dev/null | wc -l)" -ge 4
          ls -l

          # The mirrored copy on the website must be byte-identical to the release.
          for file in VoxBridge-*-android.apk VoxBridge-*-unsigned.ipa \
            VoxBridge-Setup-*-x64.exe VoxBridge-*-win64-portable.zip; do
            echo "$file $(stat -c%s "$file") bytes"
          done
          sha256sum VoxBridge-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$tag" SHA256SUMS.txt --clobber
          sha256sum -c SHA256SUMS.txt

          # The checksum the website publishes has to describe the file the
          # website serves. A rebuild that silently replaced a release file used
          # to leave those two out of step, so fail loudly if it happens again.
          python3 - <<'PY'
          import glob, hashlib, json
          manifest = json.load(open('/tmp/manifest.json'))['files']
          pattern = {
              'android': 'VoxBridge-*-android.apk',
              'ios': 'VoxBridge-*-unsigned.ipa',
              'windows': 'VoxBridge-Setup-*-x64.exe',
              'portable': 'VoxBridge-*-win64-portable.zip',
          }
          for key, glob_pattern in pattern.items():
              path = glob.glob(glob_pattern)[0]
              digest = hashlib.sha256(open(path, 'rb').read()).hexdigest()
              published = manifest[key]['sha256']
              assert digest == published, (
                  f'{key}: the site publishes {published[:12]}… but the release holds {digest[:12]}…')
              print(f'{key}: {digest[:12]}… is the checksum the site advertises')
          PY

          apk=$(ls VoxBridge-*-android.apk)
          ipa=$(ls VoxBridge-*-unsigned.ipa)
          exe=$(ls VoxBridge-Setup-*-x64.exe)
          unzip -q "$apk" -d apk
          test -f apk/AndroidManifest.xml
          test -f apk/classes.dex
          unzip -q "$ipa" -d ipa
          test -f ipa/Payload/VoxBridge.app/VoxBridge
          test -f ipa/Payload/VoxBridge.app/Info.plist
          EXE="$exe" python3 - <<'PY'
          import os, struct
          data = open(os.environ['EXE'], 'rb').read()
          assert data[-24:-16] == b'VBXPAY1\x00', 'installer footer missing'
          offset, size = struct.unpack('<QQ', data[-16:])
          assert offset + size + 24 == len(data), 'installer footer is inconsistent'
          assert data[offset:offset + 4] == b'VBXP', 'installer payload missing'
          print('installer payload is intact:', size, 'bytes')
          PY

          # The version a user sees must be the version the site advertises.
          python3 - "$apk" <<'PY'
          import json, sys
          name = sys.argv[1]
          version = json.load(open('/tmp/manifest.json'))['version']
          print('apk:', name, 'version:', version)
          assert f'-{version}-' in name, f'APK {name} does not carry {version}'
          PY

      - name: Private dashboard
        run: |
          set -euo pipefail
          base=https://voxbridge-mic.vercel.app
          url=$(grep -o "https://[a-z0-9]*\.supabase\.co" apps/web/assets/js/config.js | head -1)
          key=$(grep -o "sb_publishable_[A-Za-z0-9_]*" apps/web/assets/js/config.js | head -1)

          # A push that touches this file runs before Vercel has necessarily
          # finished deploying it, so give the new page a few minutes.
          for attempt in $(seq 1 10); do
            if curl -fsSL "$base/dashboard" -o /tmp/dashboard.html; then break; fi
            echo "dashboard not deployed yet (attempt $attempt); waiting"
            sleep 20
          done
          grep -q 'name="robots" content="noindex' /tmp/dashboard.html
          grep -q 'assets/js/dashboard.js' /tmp/dashboard.html
          curl -fsSL "$base/assets/js/dashboard.js" -o /tmp/dashboard.js
          grep -q 'owner_traffic' /tmp/dashboard.js
          curl -fsSL "$base/assets/css/dashboard.css" -o /tmp/dashboard.css
          grep -q 'live-strip' /tmp/dashboard.css
          echo "dashboard served, with its assets, and marked noindex"

          # It must stay out of the sitemap and out of the public navigation.
          curl -fsSL "$base/sitemap.xml" -o /tmp/sitemap.xml
          ! grep -q '/dashboard' /tmp/sitemap.xml
          curl -fsSL "$base/robots.txt" -o /tmp/robots.txt
          grep -q 'Disallow: /dashboard' /tmp/robots.txt
          echo "dashboard hidden from crawlers"

          # The public key can write events but must not read them, and must not
          # be able to read the owner key hash either.
          for table in page_events download_events feedback health_checks owner_access owner_auth_failures; do
            code=$(curl -s -o /tmp/table.json -w '%{http_code}' "$url/rest/v1/$table?select=*&limit=1" \
              -H "apikey: $key" -H "Authorization: Bearer $key")
            body=$(cat /tmp/table.json)
            echo "$table -> $code $body"
            if [ "$code" = "200" ]; then
              test "$body" = "[]"
            else
              test "$code" = "401" -o "$code" = "403"
            fi
          done

          # Every owner function exists and refuses a key that is too short to
          # be real. The guard rejects those before it touches the failure log,
          # so this cannot trip the owner's own lockout.
          for fn in owner_ping owner_live owner_traffic owner_health owner_messages owner_rotate; do
            params='{"p_key":"short"}'
            if [ "$fn" = "owner_rotate" ]; then params='{"p_key":"short","p_new_key":"short"}'; fi
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$url/rest/v1/rpc/$fn" \
              -H "apikey: $key" -H 'Content-Type: application/json' -d "$params")
            echo "$fn -> $code"
            test "$code" = "403"
          done

          # A wrong key is rejected, never silently ignored. One attempt only.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$url/rest/v1/rpc/owner_ping" \
            -H "apikey: $key" -H 'Content-Type: application/json' \
            -d '{"p_key":"not-the-owner-key-0000000000"}')
          echo "wrong owner key -> $code"
          test "$code" != "200"

      - name: Record site health
        run: |
          set -euo pipefail
          # The scheduled probe runs every 15 minutes; this gives the dashboard a
          # fresh row at the exact moment a release is verified.
          node scripts/health-probe.js

      - name: Supabase inserts
        run: |
          set -euo pipefail
          version=$(python3 -c 'import json;print(json.load(open("/tmp/manifest.json"))["version"])')
          url=$(grep -o "https://[a-z0-9]*\.supabase\.co" apps/web/assets/js/config.js | head -1)
          key=$(grep -o "sb_publishable_[A-Za-z0-9_]*" apps/web/assets/js/config.js | head -1)
          curl -fsS -X POST "$url/rest/v1/download_events" \
            -H "apikey: $key" -H "Authorization: Bearer $key" \
            -H 'Content-Type: application/json' \
            -d "{\"platform\":\"other\",\"version\":\"$version\",\"source\":\"smoke-test\"}" -o /dev/null
          curl -fsS -X POST "$url/rest/v1/feedback" \
            -H "apikey: $key" -H "Authorization: Bearer $key" \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"ci@voxbridge.app\",\"topic\":\"smoke-test\",\"message\":\"release smoke test\",\"platform\":\"other\",\"app_version\":\"$version\"}" -o /dev/null
          echo "supabase inserts accepted"

      - name: Report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          n=$(gh issue list --state open --search 'CI build logs in:title' --json number --jq '.[0].number // empty')
          if [ -z "$n" ]; then
            url=$(gh issue create --title "CI build logs" --body "Automated diagnostics from failed builds.")
            n=${url##*/}
          fi
          {
            echo "### Release smoke test passed (${{ github.run_id }})"
            echo ""
            echo "Website pages, same-origin download headers and range support, release assets, installer payload, APK and IPA structure, SHA-256 checksums and Supabase inserts all verified."
          } > /tmp/report.md
          gh issue comment "$n" --body-file /tmp/report.md
