name: Release smoke test

on:
  push:
    branches: [main, 'arena/**']
    paths:
      - '.github/workflows/smoke.yml'
  workflow_run:
    workflows: ['Desktop (Windows)', 'Android', 'iOS']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  smoke:
    name: Verify the live product
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    concurrency:
      group: release-smoke
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Website pages
        run: |
          set -euo pipefail
          base=https://voxbridge-app-pi.vercel.app
          for path in / /download /features /setup /privacy /terms /security /licenses /support; do
            code=$(curl -fsSL -o /dev/null -w '%{http_code}' "$base$path")
            echo "$path -> $code"
            test "$code" = "200"
          done
          curl -fsSL "$base/download" -o /tmp/download.html
          # Downloads are served from the site itself now, not from GitHub.
          for file in VoxBridge-android.apk VoxBridge-ios.ipa \
            VoxBridge-windows-setup.exe VoxBridge-windows-portable.zip; do
            grep -q "/downloads/$file" /tmp/download.html
          done
          grep -q 'data-download="android"' /tmp/download.html
          grep -q 'data-download="ios"' /tmp/download.html
          echo "download links present"

      - name: Same-origin downloads
        run: |
          set -euo pipefail
          base=https://voxbridge-app-pi.vercel.app
          curl -fsSL "$base/downloads/manifest.json" -o /tmp/manifest.json
          cat /tmp/manifest.json
          python3 - <<'PY'
          import json
          manifest = json.load(open('/tmp/manifest.json'))
          files = manifest.get('files') or {}
          for key in ('android', 'ios', 'windows', 'portable'):
              entry = files.get(key)
              assert entry, f'{key} missing from the download manifest'
              assert entry['size'] > 1000, f'{key} size looks wrong: {entry["size"]}'
              assert len(entry['sha256']) == 64, f'{key} checksum is not sha256'
          print('manifest covers', ', '.join(sorted(files)))
          PY

          # Every artifact must arrive as an attachment, with a real length and
          # range support — a phone cannot show progress or resume without them.
          for pair in "VoxBridge-android.apk:application/vnd.android.package-archive" \
                      "VoxBridge-ios.ipa:application/zip" \
                      "VoxBridge-windows-setup.exe:application/x-msdownload" \
                      "VoxBridge-windows-portable.zip:application/zip"; do
            file=${pair%%:*}
            want=${pair#*:}
            headers=$(curl -fsSIL "$base/downloads/$file")
            echo "$file"
            echo "$headers" | grep -qi '^HTTP/.* 200'
            echo "$headers" | grep -qi "^content-type: $want"
            echo "$headers" | grep -qi '^content-disposition: attachment'
            echo "$headers" | grep -qi '^accept-ranges: bytes'
            length=$(echo "$headers" | tr -d '\r' | awk 'tolower($1)=="content-length:"{print $2}' | tail -1)
            test -n "$length" && test "$length" -gt 1000
            echo "  $length bytes, $want"
          done

          # Range requests are what let a dropped mobile connection resume.
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Range: bytes=0-99' \
            "$base/downloads/VoxBridge-android.apk")
          echo "range request -> $code"
          test "$code" = "206"

      - name: Release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag=$(gh release view --json tagName --jq .tagName)
          echo "latest release: $tag"
          test "$tag" = "v$(python3 -c 'import json;print(json.load(open("/tmp/manifest.json"))["version"])')"
          mkdir -p dl
          cd dl
          # Platform builds upload in parallel, so the release can be briefly
          # incomplete while this runs.
          for attempt in 1 2 3 4 5 6; do
            gh release download "$tag" --clobber --pattern 'VoxBridge-*' --dir . || true
            count=$(ls VoxBridge-* 2>/dev/null | wc -l)
            echo "attempt $attempt: $count assets present"
            test "$count" -ge 4 && break
            sleep 20
          done
          test "$(ls VoxBridge-* 2>/dev/null | wc -l)" -ge 4
          ls -l

          # The mirrored copy on the website must be byte-identical to the release.
          for file in VoxBridge-*-android.apk VoxBridge-*-unsigned.ipa \
            VoxBridge-Setup-*-x64.exe VoxBridge-*-win64-portable.zip; do
            echo "$file $(stat -c%s "$file") bytes"
          done
          sha256sum VoxBridge-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$tag" SHA256SUMS.txt --clobber
          sha256sum -c SHA256SUMS.txt

          apk=$(ls VoxBridge-*-android.apk)
          ipa=$(ls VoxBridge-*-unsigned.ipa)
          exe=$(ls VoxBridge-Setup-*-x64.exe)
          unzip -q "$apk" -d apk
          test -f apk/AndroidManifest.xml
          test -f apk/classes.dex
          unzip -q "$ipa" -d ipa
          test -f ipa/Payload/VoxBridge.app/VoxBridge
          test -f ipa/Payload/VoxBridge.app/Info.plist
          EXE="$exe" python3 - <<'PY'
          import os, struct
          data = open(os.environ['EXE'], 'rb').read()
          assert data[-24:-16] == b'VBXPAY1\x00', 'installer footer missing'
          offset, size = struct.unpack('<QQ', data[-16:])
          assert offset + size + 24 == len(data), 'installer footer is inconsistent'
          assert data[offset:offset + 4] == b'VBXP', 'installer payload missing'
          print('installer payload is intact:', size, 'bytes')
          PY

          # The version a user sees must be the version the site advertises.
          python3 - "$apk" <<'PY'
          import json, sys
          name = sys.argv[1]
          version = json.load(open('/tmp/manifest.json'))['version']
          print('apk:', name, 'version:', version)
          assert f'-{version}-' in name, f'APK {name} does not carry {version}'
          PY

      - name: Supabase inserts
        run: |
          set -euo pipefail
          version=$(python3 -c 'import json;print(json.load(open("/tmp/manifest.json"))["version"])')
          url=$(grep -o "https://[a-z0-9]*\.supabase\.co" apps/web/assets/js/config.js | head -1)
          key=$(grep -o "sb_publishable_[A-Za-z0-9_]*" apps/web/assets/js/config.js | head -1)
          curl -fsS -X POST "$url/rest/v1/download_events" \
            -H "apikey: $key" -H "Authorization: Bearer $key" \
            -H 'Content-Type: application/json' \
            -d "{\"platform\":\"other\",\"version\":\"$version\",\"source\":\"smoke-test\"}" -o /dev/null
          curl -fsS -X POST "$url/rest/v1/feedback" \
            -H "apikey: $key" -H "Authorization: Bearer $key" \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"ci@voxbridge.app\",\"topic\":\"smoke-test\",\"message\":\"release smoke test\",\"platform\":\"other\",\"app_version\":\"$version\"}" -o /dev/null
          echo "supabase inserts accepted"

      - name: Report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          n=$(gh issue list --state open --search 'CI build logs in:title' --json number --jq '.[0].number // empty')
          if [ -z "$n" ]; then
            url=$(gh issue create --title "CI build logs" --body "Automated diagnostics from failed builds.")
            n=${url##*/}
          fi
          {
            echo "### Release smoke test passed (${{ github.run_id }})"
            echo ""
            echo "Website pages, same-origin download headers and range support, release assets, installer payload, APK and IPA structure, SHA-256 checksums and Supabase inserts all verified."
          } > /tmp/report.md
          gh issue comment "$n" --body-file /tmp/report.md
