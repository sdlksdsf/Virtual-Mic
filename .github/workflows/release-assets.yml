name: Release assets

on:
  push:
    branches: [main, 'arena/**']
    paths:
      - 'apps/web/downloads/**'
      - '.github/workflows/release-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Upload installers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view v1.0.0 >/dev/null 2>&1 || \
            gh release create v1.0.0 --title "VoxBridge 1.0.0" \
              --notes "VoxBridge turns your phone into a low-latency microphone for Windows."

      - name: Upload platform binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(apps/web/downloads/*.exe apps/web/downloads/*.zip apps/web/downloads/*.apk apps/web/downloads/*.ipa apps/web/downloads/SHA256SUMS.txt)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no binaries to publish"; exit 0
          fi
          gh release upload v1.0.0 "${files[@]}" --clobber
