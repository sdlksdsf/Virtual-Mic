name: Release assets

on:
  push:
    branches: [main, 'arena/**']
    paths:
      - 'apps/web/downloads/**'
      - '.github/workflows/release-assets.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Upload installers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view v1.0.0 >/dev/null 2>&1 || \
            gh release create v1.0.0 --title "VoxBridge 1.0.0" \
              --notes "VoxBridge turns your phone into a low-latency microphone for Windows."

      - name: Upload platform binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(apps/web/downloads/*.exe apps/web/downloads/*.zip apps/web/downloads/*.apk apps/web/downloads/*.ipa)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no binaries to publish"
          else
            gh release upload v1.0.0 "${files[@]}" --clobber
          fi

      - name: Rebuild the combined checksum file
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p verify
          gh release download v1.0.0 --dir verify --clobber \
            --pattern 'VoxBridge-*' || true
          cd verify
          rm -f SHA256SUMS.txt
          if ls VoxBridge-* >/dev/null 2>&1; then
            sha256sum VoxBridge-* | tee SHA256SUMS.txt
            gh release upload v1.0.0 SHA256SUMS.txt --clobber
          else
            echo "release has no binaries yet"
          fi
