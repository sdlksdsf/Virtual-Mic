name: iOS

on:
  push:
    branches: [main, 'arena/**']
    paths:
      - 'apps/ios/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'apps/ios/**'
  workflow_dispatch:
    inputs:
      republish:
        description: Replace the already published v1.0.1 files
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: apps/ios
        run: |
          xcodegen generate 2>&1 | tee generate.log
          test -d VoxBridge.xcodeproj || { tail -30 generate.log | sed 's/^/::error::/'; exit 1; }

      - name: Build
        working-directory: apps/ios
        run: |
          set -o pipefail
          xcodebuild \
            -project VoxBridge.xcodeproj \
            -scheme VoxBridge \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | tail -20
          status=$?
          if [ $status -ne 0 ]; then
            grep -E "(error:|fatal error:)" build.log | head -20 | sed 's/^/::error::/'
          fi
          exit $status

      - name: Package unsigned IPA
        working-directory: apps/ios
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          test -n "$APP" || { echo "::error::no .app produced"; exit 1; }
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry VoxBridge-1.0.1-unsigned.ipa Payload
          ls -lh VoxBridge-1.0.1-unsigned.ipa
          shasum -a 256 VoxBridge-1.0.1-unsigned.ipa > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: voxbridge-ios
          if-no-files-found: error
          retention-days: 30
          path: |
            apps/ios/VoxBridge-1.0.1-unsigned.ipa
            apps/ios/SHA256SUMS.txt

      - name: Publish IPA to release
        if: success() && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPUBLISH: ${{ inputs.republish || 'false' }}
        run: |
          set -euo pipefail
          # A release is immutable once people download it. Rebuilds happen on every
          # push, and byte-for-byte identical output is not guaranteed, so publishing
          # again would change what 1.0.1 means under the same version number (and
          # leave the website's mirror out of step with GitHub). Only the manual
          # `republish` run replaces files.
          if [ "${REPUBLISH:-false}" != "true" ]; then
            present=$(gh release view v1.0.1 --json assets --jq '.assets[].name')
            missing=0
            for name in 'VoxBridge-1.0.1-unsigned.ipa'; do
              printf '%s\n' "$present" | grep -qx "$name" || missing=1
            done
            if [ "$missing" = "0" ]; then
              echo "v1.0.1 already carries these files; leaving the published bytes untouched."
              exit 0
            fi
          fi
          gh release view v1.0.1 >/dev/null 2>&1 || \
            gh release create v1.0.1 --title "VoxBridge 1.0.1" --notes "See the release notes on the website." || gh release view v1.0.1 >/dev/null
          ok=0
          for attempt in 1 2 3 4 5; do
            if gh release upload v1.0.1 apps/ios/VoxBridge-1.0.1-unsigned.ipa --clobber; then ok=1; break; fi
            echo "upload attempt $attempt failed; retrying"
            sleep $((attempt * 10))
          done
          test "$ok" = "1"

      - name: Preserve build log
        if: failure()
        run: |
          mkdir -p ci-logs
          cp apps/ios/build.log ci-logs/ios-build.log 2>/dev/null || true
          cp apps/ios/generate.log ci-logs/ios-generate.log 2>/dev/null || true
          git config user.name "VoxBridge CI"
          git config user.email "ci@voxbridge.app"
          git add -f ci-logs
          git commit -m "ci: ios build log [skip ci]" || exit 0
          git pull --rebase origin "${{ github.ref_name }}" || true
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Report build log
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          n=$(gh issue list --state open --search 'CI build logs in:title' --json number --jq '.[0].number // empty')
          if [ -z "$n" ]; then
            url=$(gh issue create --title "CI build logs" --body "Automated diagnostics from failed builds.")
            n=${url##*/}
          fi
          {
            echo "### iOS build failure (run ${{ github.run_id }})"
            echo '```'
            grep -E "error:|warning:" apps/ios/build.log 2>/dev/null | head -60
            echo '--- tail ---'
            tail -n 40 apps/ios/build.log 2>/dev/null
            echo '```'
          } > /tmp/report.md
          gh issue comment "$n" --body-file /tmp/report.md
