name: iOS

on:
  push:
    branches: [main, 'arena/**']
    paths:
      - 'apps/ios/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'apps/ios/**'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: apps/ios
        run: |
          xcodegen generate 2>&1 | tee generate.log
          test -d VoxBridge.xcodeproj || { tail -30 generate.log | sed 's/^/::error::/'; exit 1; }

      - name: Build
        working-directory: apps/ios
        run: |
          set -o pipefail
          xcodebuild \
            -project VoxBridge.xcodeproj \
            -scheme VoxBridge \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | tail -20
          status=$?
          if [ $status -ne 0 ]; then
            grep -E "(error:|fatal error:)" build.log | head -20 | sed 's/^/::error::/'
          fi
          exit $status

      - name: Package unsigned IPA
        working-directory: apps/ios
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          test -n "$APP" || { echo "::error::no .app produced"; exit 1; }
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry VoxBridge-1.0.0-unsigned.ipa Payload
          ls -lh VoxBridge-1.0.0-unsigned.ipa
          shasum -a 256 VoxBridge-1.0.0-unsigned.ipa > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: voxbridge-ios
          if-no-files-found: error
          retention-days: 30
          path: |
            apps/ios/VoxBridge-1.0.0-unsigned.ipa
            apps/ios/SHA256SUMS.txt

      - name: Publish IPA to release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: VoxBridge 1.0.0
          fail_on_unmatched_files: false
          files: |
            apps/ios/VoxBridge-1.0.0-unsigned.ipa
            apps/ios/SHA256SUMS.txt

      - name: Preserve build log
        if: failure()
        run: |
          mkdir -p ci-logs
          cp apps/ios/build.log ci-logs/ios-build.log 2>/dev/null || true
          cp apps/ios/generate.log ci-logs/ios-generate.log 2>/dev/null || true
          git config user.name "VoxBridge CI"
          git config user.email "ci@voxbridge.app"
          git add -f ci-logs
          git commit -m "ci: ios build log [skip ci]" || exit 0
          git pull --rebase origin "${{ github.ref_name }}" || true
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Report build log
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          n=$(gh issue list --state open --search 'CI build logs in:title' --json number --jq '.[0].number // empty')
          if [ -z "$n" ]; then
            url=$(gh issue create --title "CI build logs" --body "Automated diagnostics from failed builds.")
            n=${url##*/}
          fi
          {
            echo "### iOS build failure (run ${{ github.run_id }})"
            echo '```'
            tail -n 80 apps/ios/generate.log 2>/dev/null
            tail -n 120 apps/ios/build.log 2>/dev/null
            echo '```'
          } > /tmp/report.md
          gh issue comment "$n" --body-file /tmp/report.md
