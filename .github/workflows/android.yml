name: Android

on:
  push:
    branches: [main, 'arena/**']
    paths:
      - 'apps/android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'apps/android/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug and release APK
        working-directory: apps/android
        run: |
          gradle --no-daemon assembleDebug
          gradle --no-daemon assembleRelease

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp apps/android/app/build/outputs/apk/debug/*.apk artifacts/VoxBridge-1.0.0-debug.apk || true
          cp apps/android/app/build/outputs/apk/release/*.apk artifacts/VoxBridge-1.0.0-android.apk || true
          cd artifacts && sha256sum *.apk > SHA256SUMS.txt && ls -lh

      - uses: actions/upload-artifact@v4
        with:
          name: voxbridge-android
          if-no-files-found: error
          retention-days: 30
          path: artifacts/*
